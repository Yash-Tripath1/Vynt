name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version)throw new Error('Tag must match package.json version')"
      - run: npm ci
      - run: npm run lint
      - name: Build installer (unsigned unless certificate secrets are configured)
        run: npm run build:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Install Electron runtime for smoke test
        run: npx electron --version
      - run: npm run test:desktop
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          Get-ChildItem release -Recurse -Filter *-Setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VYNT-Windows-installer
          path: |
            release/**/*-Setup.exe
            release/**/*.sha256
          if-no-files-found: error
      - name: Create draft release for manual verification
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "VYNT $tag" --notes-file docs/RELEASE-NOTES.md
          fi
          find release -type f \( -name '*-Setup.exe' -o -name '*.sha256' \) -exec gh release upload "$tag" {} --clobber \;
